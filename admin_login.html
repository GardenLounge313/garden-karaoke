<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login | Karaoke Reservations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', system-ui, sans-serif; }
    .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-green-950 via-gray-950 to-black min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-br from-green-500 to-green-700 items-center justify-center mb-4 shadow-lg shadow-green-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="font-display text-2xl font-bold text-white">Staff Access</h1>
      <p class="text-gray-500 text-sm mt-1">Karaoke reservation admin</p>
    </div>

    <form method="POST" class="bg-gray-900/80 border border-green-900/50 rounded-2xl p-6 shadow-2xl">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 p-3 rounded-lg text-sm {% if category == 'error' %}bg-red-900/40 text-red-300 border border-red-800{% else %}bg-green-900/40 text-green-300 border border-green-800{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
      <input type="password" name="password" required autofocus
             class="w-full bg-black/50 border border-green-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500 mb-5"
             placeholder="Enter admin password" />
      <button type="submit"
              class="w-full py-3 rounded-xl bg-green-600 hover:bg-green-500 text-white font-semibold transition shadow-lg shadow-green-900/40">
        Log in
      </button>
    </form>

    <p class="text-center mt-6">
      <a href="/" class="text-sm text-gray-500 hover:text-green-400 transition">← Back to booking page</a>
    </p>
  </div>
</body>
</html>
